name: Build native Android APK

on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native-apk.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Unit, drag & drop and crypto tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-Key-File-Explorer-native-apk
          path: native/app/build/outputs/apk/release/app-release.apk
