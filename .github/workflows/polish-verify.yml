name: Polish verification
on:
  push:
    branches: ['polish/mobile-2026-10-05']
permissions:
  contents: read
concurrency:
  group: polish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and changed-source lint
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx eslint src/components/explorer/ExplorerWindow.tsx src/components/explorer/Desktop.tsx src/store/explorerStore.ts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Capacitor APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=2
      - name: Upload build and validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polish-validation
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/reports/**
            frontend/build/
            artifacts/reports/
            artifacts/apk/
