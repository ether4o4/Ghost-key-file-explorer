name: Publish Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to update
        required: false
        default: android-preview
      asset_name:
        description: APK asset name
        required: false
        default: neversoft-services-file-explorer.apk
  # Rolling release: every push that changes the app refreshes the APK asset on the
  # fixed `android-preview` tag, so the README download link always serves the latest
  # build. `main` keeps it current after merge; the feature branch keeps it current now.
  push:
    branches:
      - main
      - claude/draggable-dual-pane-explorer-VmZWg
    paths:
      - "src/**"
      - "android/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.*"
      - ".github/workflows/publish-android-apk.yml"

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Stage APK
        env:
          ASSET_NAME: ${{ github.event.inputs.asset_name || 'neversoft-services-file-explorer.apk' }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/${ASSET_NAME}"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || 'android-preview' }}
          ASSET_NAME: ${{ github.event.inputs.asset_name || 'neversoft-services-file-explorer.apk' }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "NeverSoft Services Android Preview" \
              --notes "Stable installable debug APK for NeverSoft Services File Explorer." \
              --prerelease
          fi

          gh release upload "${RELEASE_TAG}" "dist/${ASSET_NAME}" --clobber
          echo "APK URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"
