name: Publish Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to update
        required: false
        default: android-preview
      asset_name:
        description: APK asset name
        required: false
        default: ghost-key-file-explorer.apk
  # Publishing is explicit: a source merge must not replace an existing APK
  # with a fresh CI debug signing identity. Regular builds remain CI artifacts.

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Regression tests
        run: npm test

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug

      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk'

      - name: Stage APK
        env:
          ASSET_NAME: ${{ github.event.inputs.asset_name || 'ghost-key-file-explorer.apk' }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/${ASSET_NAME}"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || 'android-preview' }}
          ASSET_NAME: ${{ github.event.inputs.asset_name || 'ghost-key-file-explorer.apk' }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "Ghost Key Android Preview" \
              --notes "Debug test APK for Ghost Key File Explorer. Installation and update compatibility require device verification." \
              --prerelease
          fi

          gh release upload "${RELEASE_TAG}" "dist/${ASSET_NAME}" --clobber
          echo "APK URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"
