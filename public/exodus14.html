<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exodus 14:14 — The Sea Divided</title>
<style>
  :root{
    /* Verse-14 highlight box, as % of the photo */
    --v14-left:31.5%; --v14-top:25.5%; --v14-width:31.5%; --v14-height:3.9%;
    --gold:#f6c651; --gold-hi:#ffe9a8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(140% 100% at 50% -10%, #241d14 0%, #100c08 45%, #050302 100%);
    font-family:'Cinzel',Georgia,'Times New Roman',serif;
    color:#f3e9d6; min-height:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:26px 14px 48px; overflow-x:hidden;
  }
  /* drifting vignette glow */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(60% 45% at 50% 32%, rgba(246,198,81,.10), transparent 70%);
    animation:breathe 7s ease-in-out infinite;
  }

  .title{position:relative;z-index:2;text-align:center}
  h1{
    font-size:clamp(20px,4.2vw,34px); letter-spacing:.14em; text-transform:uppercase;
    background:linear-gradient(180deg,#fff4d6,#e3bd6b 55%,#9c7322);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 30px rgba(246,198,81,.25);
    opacity:0; animation:fadeDown 1.1s ease .2s forwards;
  }
  .sub{
    font-size:12px;letter-spacing:.42em;color:#9a8460;margin-top:8px;
    opacity:0;animation:fadeDown 1.1s ease .45s forwards;
  }

  .frame{
    position:relative;z-index:2;margin-top:22px;
    width:min(92vw,560px); border-radius:16px; overflow:hidden;
    box-shadow:0 24px 80px rgba(0,0,0,.75), 0 0 0 1px rgba(246,198,81,.18),
               0 0 70px rgba(246,198,81,.12);
    opacity:0;transform:translateY(26px) scale(.985);
    animation:rise 1.2s cubic-bezier(.2,.7,.2,1) .3s forwards;
  }
  .photo{
    display:block;width:100%;height:auto;transform:scale(1.05);
    animation:kenburns 26s ease-in-out 2.6s infinite alternate;
  }
  /* caustic shimmer washing over the page */
  .caustics{
    position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.0;
    background:
      radial-gradient(40% 18% at 30% 20%, rgba(150,200,255,.5), transparent 60%),
      radial-gradient(50% 22% at 70% 60%, rgba(120,180,255,.4), transparent 60%),
      radial-gradient(35% 16% at 50% 85%, rgba(180,220,255,.5), transparent 60%);
    background-size:200% 200%;
    animation:caustFade 3s ease 2.4s forwards, caustMove 9s ease-in-out 2.4s infinite alternate;
  }
  .fx{position:absolute;inset:0;pointer-events:none;z-index:3}

  /* ---------- Parting Sea ---------- */
  .sea{
    position:absolute;top:-6%;bottom:-6%;width:52%;z-index:5;pointer-events:none;
    background:
      linear-gradient(90deg, rgba(8,22,46,.0), rgba(10,30,66,.96) 35%, rgba(6,18,40,1)),
      repeating-linear-gradient(115deg, rgba(120,180,255,.10) 0 8px, rgba(20,50,100,.0) 8px 22px);
    background-size:100% 100%, 220% 220%;
    box-shadow:0 0 60px rgba(60,120,220,.5);
    animation:wave 2.2s linear infinite;
  }
  .sea::after{ /* foam crest on the parting edge */
    content:"";position:absolute;top:0;bottom:0;width:26px;
    filter:blur(2px);
    background:linear-gradient(90deg,transparent,rgba(210,235,255,.85));
  }
  .sea.left{left:0;transform-origin:left;
    animation:partLeft 2.4s cubic-bezier(.7,0,.25,1) 1.1s forwards, wave 2.2s linear infinite;}
  .sea.left::after{right:0;background:linear-gradient(90deg,transparent,rgba(210,235,255,.9))}
  .sea.right{right:0;transform-origin:right;
    background:
      linear-gradient(270deg, rgba(8,22,46,.0), rgba(10,30,66,.96) 35%, rgba(6,18,40,1)),
      repeating-linear-gradient(65deg, rgba(120,180,255,.10) 0 8px, rgba(20,50,100,.0) 8px 22px);
    animation:partRight 2.4s cubic-bezier(.7,0,.25,1) 1.1s forwards, wave 2.2s linear infinite;}
  .sea.right::after{left:0;background:linear-gradient(270deg,transparent,rgba(210,235,255,.9))}

  /* ---------- Verse 14 ---------- */
  .v14{position:absolute;left:var(--v14-left);top:var(--v14-top);
       width:var(--v14-width);height:var(--v14-height);z-index:6;pointer-events:none}
  /* beam of light dropping onto the verse */
  .v14 .beam{
    position:absolute;left:50%;bottom:50%;width:140%;height:520%;
    transform:translateX(-50%);transform-origin:bottom center;
    background:linear-gradient(180deg, rgba(255,240,190,.0), rgba(255,228,150,.42) 70%, rgba(255,236,170,.6));
    clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);
    filter:blur(3px);mix-blend-mode:screen;opacity:0;
    animation:beamIn 1.1s ease 3s forwards, beamFlick 4s ease-in-out 4.1s infinite;
  }
  .v14 .ink{ /* highlighter paint sweeping L->R */
    position:absolute;inset:0;border-radius:6px;mix-blend-mode:screen;
    background:linear-gradient(100deg, rgba(246,198,81,0) 0%, rgba(246,198,81,.5) 16%, rgba(255,224,130,.62) 100%);
    transform-origin:left center;transform:scaleX(0);
    animation:sweep 1s cubic-bezier(.4,0,.2,1) 3.2s forwards;
  }
  .v14 .ring{ /* pulsing golden frame */
    position:absolute;inset:-3px;border:2px solid rgba(246,198,81,.9);border-radius:8px;opacity:0;
    box-shadow:0 0 22px 5px rgba(246,198,81,.45),inset 0 0 16px rgba(246,198,81,.4);
    animation:ringIn .6s ease 3.9s forwards, pulse 2.3s ease-in-out 4.5s infinite;
  }
  .v14 .shine{ /* glossy shimmer streak that keeps sliding across */
    position:absolute;top:0;left:-40%;width:35%;height:100%;border-radius:6px;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.75),transparent);
    mix-blend-mode:overlay;opacity:0;
    animation:shineGo 3.4s ease-in-out 4.6s infinite;
  }
  .v14 .tag{
    position:absolute;right:-10px;top:-38px;
    background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#2a1d05;
    font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:12px;letter-spacing:.04em;
    padding:4px 11px;border-radius:20px;white-space:nowrap;
    box-shadow:0 8px 20px rgba(0,0,0,.55),0 0 20px rgba(246,198,81,.45);
    opacity:0;transform:translateY(8px) scale(.9);
    animation:tagIn .55s cubic-bezier(.2,1.4,.4,1) 4.2s forwards, bob 3s ease-in-out 4.8s infinite;
  }
  .v14 .tag::after{content:"";position:absolute;right:16px;bottom:-5px;
    border:6px solid transparent;border-top-color:var(--gold);border-bottom:0}

  /* ---------- caption ---------- */
  .verse{position:relative;z-index:2;margin-top:32px;max-width:560px;text-align:center;
    opacity:0;transform:translateY(18px);animation:rise 1.1s ease 4.6s forwards}
  blockquote{font-size:clamp(20px,4.6vw,30px);line-height:1.45;font-style:italic;
    background:linear-gradient(180deg,#fbf1d4,#eccf8f 60%,#caa24f);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 16px rgba(246,198,81,.25))}
  blockquote .em{font-style:normal;font-variant:small-caps;letter-spacing:.05em}
  cite{display:block;margin-top:16px;font-style:normal;font-size:13px;letter-spacing:.36em;
    text-transform:uppercase;color:#b59a63}
  .rule{width:0;height:2px;margin:18px auto 0;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    animation:grow 1.3s ease 5.1s forwards}

  /* ---------- keyframes ---------- */
  @keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}
  @keyframes kenburns{from{transform:scale(1.05) translate(0,0)}to{transform:scale(1.12) translate(-1.2%,-1%)}}
  @keyframes caustFade{to{opacity:.5}}
  @keyframes caustMove{from{background-position:0% 0%,0% 0%,0% 0%}to{background-position:100% 60%,-60% 30%,40% 100%}}
  @keyframes wave{to{background-position:0 0,-220px 0}}
  @keyframes partLeft{to{transform:translateX(-102%)}}
  @keyframes partRight{to{transform:translateX(102%)}}
  @keyframes sweep{to{transform:scaleX(1)}}
  @keyframes ringIn{to{opacity:1}}
  @keyframes pulse{0%,100%{box-shadow:0 0 16px 3px rgba(246,198,81,.4),inset 0 0 12px rgba(246,198,81,.3);border-color:rgba(246,198,81,.7)}
    50%{box-shadow:0 0 34px 9px rgba(246,198,81,.75),inset 0 0 20px rgba(246,198,81,.55);border-color:var(--gold-hi)}}
  @keyframes shineGo{0%{left:-40%;opacity:0}8%{opacity:1}45%{left:105%;opacity:0}100%{left:105%;opacity:0}}
  @keyframes beamIn{to{opacity:1}}
  @keyframes beamFlick{0%,100%{opacity:.85}50%{opacity:1}}
  @keyframes tagIn{to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes grow{to{width:220px}}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s!important;animation-iteration-count:1!important}
    .sea{display:none}.photo{transform:none}.v14 .ink{transform:scaleX(1)}
    .v14 .ring,.v14 .beam,.v14 .tag{opacity:1}
  }
</style>
</head>
<body>
  <div class="title">
    <h1>The Sea Divided</h1>
    <div class="sub">EXODUS · CHAPTER 14</div>
  </div>

  <figure class="frame" id="frame">
    <img class="photo" id="photo" src="./exodus14.jpg"
         alt="Open Bible at Exodus 14 with verse 14 highlighted" />
    <div class="caustics"></div>
    <div class="sea left"></div>
    <div class="sea right"></div>
    <canvas class="fx" id="fx"></canvas>
    <div class="v14">
      <span class="beam"></span>
      <span class="ink"></span>
      <span class="ring"></span>
      <span class="shine"></span>
      <span class="tag">Exodus 14:14</span>
    </div>
  </figure>

  <div class="verse">
    <blockquote>&ldquo;The <span class="em">Lord</span> shall fight for you,<br/>
      and ye shall hold your peace.&rdquo;</blockquote>
    <div class="rule"></div>
    <cite>Exodus 14 : 14 &nbsp;·&nbsp; King James Version</cite>
  </div>

<script>
(() => {
  const frame = document.getElementById('frame');
  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  // verse-14 center, from the CSS vars
  const css = getComputedStyle(document.documentElement);
  const pct = v => parseFloat(css.getPropertyValue(v)) / 100;
  const vc = { x: pct('--v14-left') + pct('--v14-width')/2,
               y: pct('--v14-top')  + pct('--v14-height')/2 };

  let W=0, H=0, dpr=1;
  function resize(){
    dpr = Math.min(2, window.devicePixelRatio||1);
    W = frame.clientWidth; H = frame.clientHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize(); addEventListener('resize', resize);

  // rising golden embers / dust motes
  const N = 70, motes = [];
  function spawn(initial){
    const cx = vc.x*W, cy = vc.y*H;
    return {
      x: cx + (Math.random()-.5)*W*0.5,
      y: initial ? Math.random()*H : cy + (Math.random()-.2)*H*0.18,
      vy: -(0.15 + Math.random()*0.5),
      vx: (Math.random()-.5)*0.25,
      r: 0.6 + Math.random()*2.0,
      a: 0, amax: 0.25 + Math.random()*0.65,
      tw: Math.random()*Math.PI*2,
      tws: 0.02 + Math.random()*0.05,
      life: 0, max: 260 + Math.random()*260
    };
  }
  for(let i=0;i<N;i++) motes.push(spawn(true));

  let t0 = performance.now();
  function frameLoop(now){
    const t = (now - t0)/1000;
    ctx.clearRect(0,0,W,H);

    // god-rays fanning up from the verse (fade in ~3.2s)
    const cx = vc.x*W, cy = vc.y*H;
    const rayA = Math.min(1, Math.max(0,(t-3.2)/1.2));
    if (rayA > 0){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(cx, cy);
      const rays = 7, len = H*0.9, sway = Math.sin(t*0.6)*0.08;
      for(let i=0;i<rays;i++){
        const ang = -Math.PI/2 + (i-(rays-1)/2)*0.16 + sway;
        const w = (0.018 + 0.01*Math.sin(t*1.3+i))*1;
        const g = ctx.createLinearGradient(0,0,Math.cos(ang)*len,Math.sin(ang)*len);
        g.addColorStop(0,`rgba(255,228,150,${0.16*rayA})`);
        g.addColorStop(1,'rgba(255,228,150,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(ang-w)*len, Math.sin(ang-w)*len);
        ctx.lineTo(Math.cos(ang+w)*len, Math.sin(ang+w)*len);
        ctx.closePath(); ctx.fill();
      }
      // soft core glow on the verse
      const cg = ctx.createRadialGradient(0,0,0,0,0,W*0.16);
      cg.addColorStop(0,`rgba(255,232,160,${0.22*rayA})`);
      cg.addColorStop(1,'rgba(255,232,160,0)');
      ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0,0,W*0.16,0,7); ctx.fill();
      ctx.restore();
    }

    // embers (start drifting after the sea parts ~2.4s)
    const emberA = Math.min(1, Math.max(0,(t-2.4)/1.5));
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for(const m of motes){
      m.life++; m.x += m.vx; m.y += m.vy; m.vy -= 0.0006; m.tw += m.tws;
      if(m.a < m.amax) m.a += 0.01;
      if(m.life > m.max || m.y < -10){ Object.assign(m, spawn(false)); }
      const tw = 0.55 + 0.45*Math.sin(m.tw);
      const al = m.a * tw * emberA;
      const g = ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r*3);
      g.addColorStop(0,`rgba(255,221,140,${al})`);
      g.addColorStop(1,'rgba(255,200,90,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r*3,0,7); ctx.fill();
    }
    ctx.restore();
    requestAnimationFrame(frameLoop);
  }
  requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
